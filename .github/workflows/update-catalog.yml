name: Update Catalog

on:
  repository_dispatch:
    types:
      - plugin_release_published
  workflow_dispatch:
    inputs:
      repo:
        description: GitHub repository in owner/name form
        required: true
        type: string
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: write

# One group per plugin. GitHub keeps a single pending run per group and
# cancels any older pending run, so a shared group dropped one plugin's update
# whenever three releases landed together. A newer release of the same plugin
# supersedes an older pending one anyway; different plugins run in parallel and
# the push loop below resolves their races.
concurrency:
  group: plugin-catalog-update-${{ inputs.repo || github.event.client_payload.repo }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.CATALOG_PUSH_TOKEN }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Update and push the catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLUGIN_REPO: ${{ inputs.repo || github.event.client_payload.repo }}
          PLUGIN_TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        run: |
          test -n "$PLUGIN_REPO"
          test -n "$PLUGIN_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A repository_dispatch run checks out main as it was when the release
          # fired, and other releases may have updated the catalog since. Each
          # attempt rebuilds the entry on the current main, so losing a push race
          # retries instead of conflicting on manifest.json.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard FETCH_HEAD
            go run ./cmd/update-catalog -repo "$PLUGIN_REPO" -tag "$PLUGIN_TAG"
            if git diff --quiet -- manifest.json; then
              echo "The catalog already lists ${PLUGIN_REPO}@${PLUGIN_TAG}."
              exit 0
            fi
            git add manifest.json
            git commit --quiet -m "chore: update catalog for ${PLUGIN_REPO}@${PLUGIN_TAG}"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Could not push the catalog update after 5 attempts." >&2
          exit 1
