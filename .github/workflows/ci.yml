name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    uses: Silo-Server/silo-plugins/.github/workflows/trusted-linux-ci.yml@main
    with:
      self_hosted: ${{ github.repository == 'Silo-Server/silo-plugins' && ((github.event_name == 'pull_request' && contains(fromJSON(vars.SILO_CI_MEMBERS || '[]'), github.event.pull_request.user.login)) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
